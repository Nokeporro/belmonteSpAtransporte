# Perfil de los tests de integración: esquema aparte para no tocar la base de desarrollo.
# Preparación única: ver el Javadoc de IntegrationTest.
spring.datasource.url=${TEST_DB_URL:jdbc:mariadb://localhost:3307/belmonte_test}
spring.datasource.username=${TEST_DB_USER:belmonte}
spring.datasource.password=${TEST_DB_PASSWORD:belmonte_dev}

# Solo en este perfil: ReiniciarEsquemaConfig limpia y migra el esquema de pruebas en cada
# ejecución (y se niega a hacerlo si la URL no termina en "_test").
spring.flyway.clean-disabled=false

spring.jpa.properties.hibernate.format_sql=false
