# Motivos de los 400 de validación (README, "Errores"): mayúscula inicial, punto final y sin
# el valor rechazado. Sobrescriben los mensajes estándar de Jakarta Validation.
jakarta.validation.constraints.NotNull.message=Es obligatorio.
jakarta.validation.constraints.NotBlank.message=Es obligatorio.
jakarta.validation.constraints.NotEmpty.message=Es obligatorio.
jakarta.validation.constraints.Size.message=Debe tener entre {min} y {max} caracteres.
jakarta.validation.constraints.Pattern.message=Tiene un formato inválido.
jakarta.validation.constraints.Positive.message=Debe ser mayor que 0.
jakarta.validation.constraints.Min.message=Debe ser mayor o igual que {value}.
jakarta.validation.constraints.Max.message=Debe ser menor o igual que {value}.
jakarta.validation.constraints.DecimalMin.message=Debe ser mayor o igual que {value}.
jakarta.validation.constraints.DecimalMax.message=Debe ser menor o igual que {value}.
jakarta.validation.constraints.Digits.message=Debe tener hasta {integer} dígitos enteros y {fraction} decimales.
jakarta.validation.constraints.Future.message=Debe ser una fecha futura.

# Propios.
validacion.maximo=Debe tener como máximo {max} caracteres.
validacion.rut=Debe ser un RUT válido, como 76543210-3.
validacion.contrasena.largo=Debe tener entre 8 y 72 caracteres.
validacion.contrasena.bytes=Debe ocupar como máximo 72 bytes en UTF-8.
validacion.contrasena.composicion=Debe incluir al menos una letra y un dígito.
