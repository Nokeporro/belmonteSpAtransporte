# To run with in-memory H2 for local development: use -Dspring.profiles.active=dev
# Example: mvn -DskipTests -Dspring-boot.run.profiles=dev spring-boot:run
spring.application.name=transporte

# MariaDB local/dev. En otros entornos, inyectar estas variables desde el
# entorno de despliegue; nunca guardar credenciales reales en el repositorio.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3307/belmonte}
spring.datasource.username=${DB_USER:belmonte}
spring.datasource.password=${DB_PASSWORD:belmonte_dev}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# Hora de Chile en cada sesión (también la de Flyway): CURRENT_TIMESTAMP/NOW() de
# fecha_registro, fh_creacion, historial y la V3 quedan en la misma zona que los
# LocalDateTime que escribe la app. Requiere que el servidor tenga cargado tzinfo
# (la imagen oficial de MariaDB lo carga al inicializar).
spring.datasource.hikari.connection-init-sql=SET time_zone = '${DB_TIME_ZONE:America/Santiago}'

# El esquema se administrará mediante migraciones versionadas en una etapa
# posterior; Hibernate no debe modificar la base automáticamente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT: el valor por defecto sirve solo para desarrollo local. En despliegue,
# define JWT_SECRET como una clave Base64 aleatoria de al menos 256 bits.
app.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Clave HMAC para PASAJERO.dni_hash; el valor por defecto sirve solo para
# desarrollo local. Cambiarla invalida los hashes ya guardados.
app.dni.secret=${DNI_SECRET:belmonte-dev-dni-secret-cambiar-en-despliegue}

# Vigencia de la contraseña temporal de "olvidé mi contraseña" (RF21).
app.password-temporal.minutos=${PASSWORD_TEMPORAL_MINUTOS:30}
