spring.application.name=transporte

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3307/belmonte}
spring.datasource.username=${DB_USER:belmonte}
spring.datasource.password=${DB_PASSWORD:belmonte_dev}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.connection-init-sql=SET time_zone = '${DB_TIME_ZONE:America/Santiago}'

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:28800}

app.dni.secret=${DNI_SECRET:belmonte-dev-dni-secret-cambiar-en-despliegue}

app.password-temporal.horas=${PASSWORD_TEMPORAL_HORAS:24}

app.mail.from=${MAIL_FROM:no-reply@belmontespa.cl}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.firebase.credentials-file=${FIREBASE_CREDENTIALS_FILE:}
