name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Lint, pruebas y APK
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleDemo

      - name: Subir reporte de lint
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lint
          path: android/app/build/reports/lint-results-debug.*
          retention-days: 7

      - name: Subir APK
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/demo/*.apk
          retention-days: 7
