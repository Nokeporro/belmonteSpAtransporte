name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Escribir credenciales
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
        run: |
          # Sin el secreto (por ejemplo, en un PR desde un fork) la app compila sin Firebase.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          fi
          echo "PLACES_API_KEY=$PLACES_API_KEY" >> local.properties

      - name: Lint, pruebas y APK
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleDemo

      - name: Subir reporte de lint
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lint
          path: android/app/build/reports/lint-results-debug.*
          retention-days: 7

      - name: Subir APK
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/demo/*.apk
          retention-days: 7
